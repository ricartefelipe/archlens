quarkus.application.name=archlens-backend
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://127.0.0.1:3000
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,idempotency-key,x-user,x-roles
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-postgresql.yaml

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# OpenAPI
quarkus.smallrye-openapi.path=/api/v1/openapi
mp.openapi.extensions.smallrye.info.title=ArchLens API
mp.openapi.extensions.smallrye.info.version=1.0.0

# ArchLens
archlens.organization.name=${ARCHLENS_ORG_NAME:ArchLens Local}
archlens.llm.enabled=${ARCHLENS_LLM_ENABLED:false}
archlens.llm.base-url=${ARCHLENS_LLM_BASE_URL:}
archlens.llm.api-key=${ARCHLENS_LLM_API_KEY:}
archlens.llm.model=${ARCHLENS_LLM_MODEL:gpt-4o-mini}

# Datasource (override in profiles)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${ARCHLENS_DB_URL:jdbc:postgresql://localhost:5432/archlens}
quarkus.datasource.username=${ARCHLENS_DB_USER:archlens}
quarkus.datasource.password=${ARCHLENS_DB_PASSWORD:archlens}

# OIDC (disabled by default for local/dev header auth; enable in hardened deploys)
quarkus.oidc.enabled=${ARCHLENS_OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${ARCHLENS_OIDC_URL:http://localhost:8081/realms/archlens}
quarkus.oidc.client-id=${ARCHLENS_OIDC_CLIENT_ID:archlens-api}
quarkus.oidc.credentials.secret=${ARCHLENS_OIDC_CLIENT_SECRET:archlens-api-secret}
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.tls.verification=none
quarkus.http.auth.proactive=false

# --- prod ---
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.oidc.enabled=${ARCHLENS_OIDC_ENABLED:false}

# --- dev ---
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:archlens;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc.tenant-enabled=false
%dev.quarkus.liquibase.enabled=false
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.http.auth.proactive=false

# --- test ---
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:archlens-test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.liquibase.enabled=false
%test.quarkus.liquibase.migrate-at-start=false
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.http.auth.proactive=false
