quarkus.application.name=archlens-backend
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=${ARCHLENS_MAX_BODY_SIZE:6M}
quarkus.http.idle-timeout=${ARCHLENS_HTTP_IDLE_TIMEOUT:30S}
quarkus.http.read-timeout=${ARCHLENS_HTTP_READ_TIMEOUT:60S}

# CORS (override por ambiente)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ARCHLENS_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,idempotency-key,x-user,x-roles,x-organization-id,x-correlation-id
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.access-control-allow-credentials=false

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-postgresql.yaml

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false

# OpenAPI / Swagger (público só fora de prod)
quarkus.smallrye-openapi.path=/api/v1/openapi
mp.openapi.extensions.smallrye.info.title=ArchLens API
mp.openapi.extensions.smallrye.info.version=1.0.0
quarkus.swagger-ui.always-include=false

# ArchLens
archlens.organization.name=${ARCHLENS_ORG_NAME:ArchLens Local}
archlens.import.max-bytes=${ARCHLENS_IMPORT_MAX_BYTES:5242880}
archlens.raw-json.retention=import-audit
archlens.raw-json.policy=No source code; analysis.json only (paths, signals, hashes). Size limited by archlens.import.max-bytes.
archlens.llm.enabled=${ARCHLENS_LLM_ENABLED:false}
archlens.llm.base-url=${ARCHLENS_LLM_BASE_URL:}
archlens.llm.api-key=${ARCHLENS_LLM_API_KEY:}
archlens.llm.model=${ARCHLENS_LLM_MODEL:gpt-4o-mini}
archlens.scores.disclaimer=Scores apoiam decisão; não são precisão científica.
archlens.local-header-auth.enabled=${ARCHLENS_LOCAL_HEADER_AUTH:false}
archlens.security.require-hardened=${ARCHLENS_REQUIRE_HARDENED:false}
archlens.rate-limit.import-per-minute=${ARCHLENS_RATE_LIMIT_IMPORT:30}
archlens.security.hsts.enabled=${ARCHLENS_HSTS_ENABLED:false}
archlens.profile.label=${ARCHLENS_PROFILE_LABEL:unspecified}

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${ARCHLENS_DB_URL:jdbc:postgresql://localhost:5432/archlens}
quarkus.datasource.username=${ARCHLENS_DB_USER:archlens}
quarkus.datasource.password=${ARCHLENS_DB_PASSWORD:archlens}

# OIDC
quarkus.oidc.enabled=${ARCHLENS_OIDC_ENABLED:false}
quarkus.oidc.auth-server-url=${ARCHLENS_OIDC_URL:http://localhost:8081/realms/archlens}
quarkus.oidc.client-id=${ARCHLENS_OIDC_CLIENT_ID:archlens-api}
quarkus.oidc.credentials.secret=${ARCHLENS_OIDC_CLIENT_SECRET:archlens-api-secret}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.issuer=${ARCHLENS_OIDC_ISSUER:http://localhost:8081/realms/archlens}
quarkus.oidc.token.audience=${ARCHLENS_OIDC_AUDIENCE:archlens-api}
# TLS via registry (quarkus.oidc.tls.verification está deprecado no 3.33)
quarkus.oidc.tls.tls-configuration-name=oidc
quarkus.tls.oidc.trust-all=${ARCHLENS_OIDC_TLS_TRUST_ALL:false}
quarkus.http.auth.proactive=false

# Health / metrics (defaults Quarkus: /q/health, /q/health/live, /q/health/ready)
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder-enabled-default=true

# Logs: sem dump de body/JSON; correlation via filtro MDC
# Tracing OpenTelemetry: opcional (planejado) — não embutido no MVP para evitar dependência obrigatória
quarkus.log.category."io.archlens".level=INFO
quarkus.log.category."io.quarkus.oidc".level=WARN
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] [correlationId=%X{correlationId}] %s%e%n

# --- demo: Compose local / demonstração (explícito, não é produção) ---
%demo.archlens.profile.label=demo
%demo.archlens.local-header-auth.enabled=${ARCHLENS_LOCAL_HEADER_AUTH:true}
%demo.archlens.security.require-hardened=false
%demo.archlens.security.hsts.enabled=false
%demo.quarkus.oidc.enabled=${ARCHLENS_OIDC_ENABLED:false}
%demo.quarkus.tls.oidc.trust-all=${ARCHLENS_OIDC_TLS_TRUST_ALL:true}
%demo.quarkus.swagger-ui.always-include=true
%demo.quarkus.swagger-ui.path=/q/swagger-ui
%demo.quarkus.log.console.json.enabled=false
%demo.quarkus.http.cors.origins=${ARCHLENS_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# --- prod: endurecido; falha no startup se config crítica ausente ---
%prod.archlens.profile.label=production
%prod.archlens.local-header-auth.enabled=false
%prod.archlens.security.require-hardened=true
%prod.archlens.security.hsts.enabled=${ARCHLENS_HSTS_ENABLED:true}
%prod.quarkus.oidc.enabled=true
%prod.quarkus.tls.oidc.trust-all=false
%prod.quarkus.oidc.auth-server-url=${ARCHLENS_OIDC_URL}
%prod.quarkus.oidc.client-id=${ARCHLENS_OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${ARCHLENS_OIDC_CLIENT_SECRET}
%prod.quarkus.oidc.token.issuer=${ARCHLENS_OIDC_ISSUER}
%prod.quarkus.oidc.token.audience=${ARCHLENS_OIDC_AUDIENCE:archlens-api}
%prod.quarkus.datasource.jdbc.url=${ARCHLENS_DB_URL}
%prod.quarkus.datasource.username=${ARCHLENS_DB_USER}
%prod.quarkus.datasource.password=${ARCHLENS_DB_PASSWORD}
%prod.quarkus.http.cors.origins=${ARCHLENS_CORS_ORIGINS}
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.smallrye-openapi.enable=${ARCHLENS_OPENAPI_ENABLED:false}
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.log.level=INFO

# --- dev (H2 apenas bootstrap local rápido) ---
%dev.archlens.profile.label=development
%dev.archlens.local-header-auth.enabled=true
%dev.archlens.security.require-hardened=false
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:archlens;DB_CLOSE_DELAY=-1
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa
%dev.quarkus.oidc.enabled=false
%dev.quarkus.oidc.tenant-enabled=false
%dev.quarkus.tls.oidc.trust-all=true
%dev.quarkus.liquibase.enabled=false
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%dev.quarkus.http.auth.proactive=false
%dev.quarkus.swagger-ui.always-include=true
%dev.quarkus.log.console.json.enabled=false

# --- test: Postgres via Testcontainers ---
%test.archlens.profile.label=test
%test.archlens.local-header-auth.enabled=true
%test.archlens.security.require-hardened=false
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.liquibase.enabled=true
%test.quarkus.liquibase.migrate-at-start=true
%test.quarkus.liquibase.change-log=db/changelog/db.changelog-postgresql.yaml
%test.quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.oidc.enabled=false
%test.quarkus.oidc.tenant-enabled=false
%test.quarkus.tls.oidc.trust-all=true
%test.quarkus.http.auth.proactive=false
%test.quarkus.http.test-port=0
%test.quarkus.http.port=0
%test.quarkus.log.console.json.enabled=false
%test.quarkus.micrometer.enabled=true
