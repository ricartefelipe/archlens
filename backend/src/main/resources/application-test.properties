# URL JDBC e credenciais vêm de PostgresTestResource (Testcontainers).
# Se Docker Desktop estiver inativo: DOCKER_HOST=unix:///var/run/docker.sock
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-postgresql.yaml
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.oidc.enabled=false
quarkus.oidc.tenant-enabled=false
# Evita colisão com Keycloak local na 8081 (default histórico do Quarkus test-port)
quarkus.http.test-port=0
quarkus.http.port=0
