services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: archlens
      POSTGRES_USER: archlens
      POSTGRES_PASSWORD: archlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archlens -d archlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-archlens.json:/opt/keycloak/data/import/realm-archlens.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      QUARKUS_PROFILE: prod
      ARCHLENS_DB_URL: jdbc:postgresql://postgres:5432/archlens
      ARCHLENS_DB_USER: archlens
      ARCHLENS_DB_PASSWORD: archlens
      ARCHLENS_OIDC_ENABLED: "false"
      ARCHLENS_OIDC_URL: http://keycloak:8081/realms/archlens
      ARCHLENS_OIDC_CLIENT_ID: archlens-api
      ARCHLENS_OIDC_CLIENT_SECRET: archlens-api-secret
      ARCHLENS_LLM_ENABLED: "false"
      # OIDC desligado no compose local: API aceita X-User/X-Roles (frontend envia).
      # Keycloak permanece disponível para login UI / evolução OIDC.
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
        NEXT_PUBLIC_OIDC_ISSUER: http://localhost:8081/realms/archlens
        NEXT_PUBLIC_OIDC_CLIENT_ID: archlens-frontend
        NEXTAUTH_URL: http://localhost:3000
        NEXTAUTH_SECRET: archlens-local-nextauth-secret
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      HOSTNAME: "0.0.0.0"
      AUTH_SECRET: archlens-local-nextauth-secret
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: archlens-local-nextauth-secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      AUTH_LOCAL_ENABLED: "true"
      KEYCLOAK_ISSUER: http://localhost:8081/realms/archlens
      KEYCLOAK_CLIENT_ID: archlens-frontend
      KEYCLOAK_CLIENT_SECRET: archlens-frontend-secret
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  pgdata:
