name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test analyzer
        working-directory: analyzer
        run: |
          if [ -f mvnw ]; then ./mvnw -B test; else mvn -B test; fi
      - name: Scan sample and validate
        working-directory: analyzer
        run: |
          if [ -f mvnw ]; then MVN=./mvnw; else MVN=mvn; fi
          $MVN -B -pl cli -am package -DskipTests
          java -jar cli/target/archlens-cli-*.jar scan --path ../samples/legacy-java-demo --out /tmp/analysis.json
          java -jar cli/target/archlens-cli-*.jar validate --file /tmp/analysis.json

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: |
          if [ -f mvnw ]; then ./mvnw -B test; else mvn -B test; fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Schema present
        run: test -f contracts/analysis.schema.json
